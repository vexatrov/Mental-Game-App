name: Android

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Needed to publish the APKs as a GitHub Release.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Signed with the debug key: fine for sideloading onto your own phone.
      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: mental-game-apk
          path: build/app/outputs/flutter-apk/*-release.apk

      # A plain .apk behind a stable link is far easier to install from a
      # phone than a zipped artifact:
      # https://github.com/<owner>/<repo>/releases/latest/download/app-arm64-v8a-release.apk
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mental Game build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Install on Android: download `app-arm64-v8a-release.apk` (fits most phones) and open it.
            Older 32-bit phones: `app-armeabi-v7a-release.apk`.
          files: build/app/outputs/flutter-apk/*-release.apk
