name: Android

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Needed to publish the APKs as a GitHub Release.
      contents: write
    env:
      # Set once the Play upload key is added as repository secrets
      # (see docs/play-store/LAUNCH.md). Without it, builds use a throwaway
      # debug key and no app bundle is made.
      HAS_UPLOAD_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Set up upload key
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nkeyAlias=upload\nstorePassword=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties

      # The run number is the versionCode, so every build can update the last.
      - run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      - name: Build app bundle for Google Play
        if: env.HAS_UPLOAD_KEY == 'true'
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: traders-mind-build
          path: |
            build/app/outputs/flutter-apk/*-release.apk
            build/app/outputs/bundle/release/app-release.aab

      # A plain .apk behind a stable link is far easier to install from a
      # phone than a zipped artifact:
      # https://github.com/<owner>/<repo>/releases/latest/download/app-arm64-v8a-release.apk
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Trader's Mind build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Install on Android: download `app-arm64-v8a-release.apk` (fits most phones) and open it.
            Older 32-bit phones: `app-armeabi-v7a-release.apk`.
            `app-release.aab` (when present) is the file to upload to Google Play; it can't be installed directly.
          files: |
            build/app/outputs/flutter-apk/*-release.apk
            build/app/outputs/bundle/release/app-release.aab
